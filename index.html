<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kathakali Run</title>
  <meta name="description" content="A Kerala-themed endless runner you play with hand gestures. Show a palm to jump, a fist to duck." />
  <meta name="theme-color" content="#0e0a08" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400..700&family=Anek+Malayalam:wght@500;600&family=Pixelify+Sans:wght@500..700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --night:  #0e0a08;
      --wood:   #1c1510;
      --edge:   #3a2a18;
      --text:   #f3ead9;
      --dim:    #b5a892;
      /* the five cloth colours of the curtain */
      --red:    #c4261d;
      --yellow: #f4b400;
      --green:  #17803d;
      --cream:  #f6efe0;
      --black:  #15100d;
      --sans:   'Anek Latin', 'Helvetica Neue', Arial, sans-serif;
      --pixel:  'Pixelify Sans', 'Anek Latin', sans-serif;
      --ml:     'Anek Malayalam', 'Malayalam Sangam MN', sans-serif;
      --ease:   cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { background: var(--night); color-scheme: dark; }

    body {
      min-height: 100dvh;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(ellipse 55% 38% at 50% 58%, rgba(217, 165, 58, 0.13), transparent 70%),
        var(--night);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: var(--yellow); color: var(--black); }

    :focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

    [hidden] { display: none !important; }

    #app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 20px 24px 40px;
    }

    .bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .mark {
      font-family: var(--pixel);
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .count {
      font-size: 0.875rem;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      align-self: center;
      padding: 32px 0 8px;
    }

    /* ── Stage ─────────────────────────────────────────────────────────────── */

    .stage {
      position: relative;
      aspect-ratio: 8 / 3;
      container-type: inline-size;
      overflow: hidden;
      border-radius: 6px;
      background: #0a0706;
      box-shadow:
        0 0 0 1px #2c2118,
        0 0 0 6px var(--wood),
        0 0 0 7px var(--edge),
        0 34px 60px rgba(0, 0, 0, 0.6);
      touch-action: manipulation;
      -webkit-user-select: none;
              user-select: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: max(2.4cqw, 8px);
      left: max(2.6cqw, 10px);
      right: max(2.6cqw, 10px);
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      font-family: var(--pixel);
      font-size: max(2.3cqw, 14px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9), 0 2px 8px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    /* ── Curtain (thirasheela) ─────────────────────────────────────────────── */

    #hud-best-row { margin-right: auto; }

    .curtain {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(5.6cqw, 22px);
      text-align: center;
      color: var(--cream);
      background: var(--red);
      box-shadow:
        inset 0 0 0 0.5cqw var(--black),
        inset 0 0 0 1.9cqw var(--yellow),
        inset 0 0 0 3.3cqw var(--green),
        inset 0 0 0 3.9cqw var(--cream),
        inset 0 0 0 4.3cqw var(--black);
      /* rising back up, after a beat so the crash is seen */
      transition: transform 0.5s var(--ease) 0.4s, visibility 0s 0.4s;
    }

    /* soft folds in the cloth */
    .curtain::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(0, 0, 0, 0.22), transparent 11%,
        rgba(255, 255, 255, 0.06) 27%, transparent 44%,
        rgba(0, 0, 0, 0.1) 61%, transparent 78%,
        rgba(255, 255, 255, 0.05) 88%, rgba(0, 0, 0, 0.22));
      pointer-events: none;
    }

    /* dropped: falls like cloth let go */
    .curtain.down {
      transform: translateY(103%);
      visibility: hidden;
      transition: transform 0.6s cubic-bezier(0.6, 0, 0.9, 0.4), visibility 0s 0.6s;
    }

    .panel {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
    }

    .panel h1,
    .panel h2 {
      font-family: var(--pixel);
      font-size: max(5.8cqw, 26px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
      text-wrap: balance;
    }

    .panel .ml {
      font-family: var(--ml);
      font-size: 2.6cqw;
      font-weight: 600;
      line-height: 1.3;
      margin-top: 0.8cqw;
    }

    .result {
      display: flex;
      gap: 3.4cqw;
      margin-top: 1.6cqw;
      font-size: max(2cqw, 14px);
      font-weight: 500;
    }

    .result b {
      font-family: var(--pixel);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-left: 0.4em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 26px;
      border-radius: 6px;
      background: var(--yellow);
      color: var(--black);
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 3px 0 #9c6f00, 0 8px 14px rgba(0, 0, 0, 0.3);
      transition: transform 0.16s var(--ease), box-shadow 0.16s var(--ease), background 0.16s ease;
    }

    .btn:hover { background: #ffc61a; }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #9c6f00, 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .btn:disabled {
      background: #8f2a22;
      color: #f0cfc8;
      box-shadow: none;
      cursor: progress;
    }

    .panel .btn { margin-top: 2.6cqw; }

    .hint {
      margin-top: 1.4cqw;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .hint:empty { display: none; }

    /* narrow stage (phones): keep only what fits */
    @container (max-width: 560px) {
      .panel .ml, .hint { display: none; }
      .panel-over { grid-template-columns: auto auto; align-items: center; gap: 4px 16px; }
      .panel-over h2 { display: none; }
      .panel-over .result { flex-direction: column; gap: 2px; margin: 0; text-align: left; }
      .panel .btn { height: 38px; padding: 0 18px; margin-top: 10px; }
      .panel-over .btn { margin-top: 0; }
    }

    /* ── Controls ──────────────────────────────────────────────────────────── */

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      gap: 56px;
      margin-top: 48px;
    }

    .controls h2 {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .hand {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px 28px;
      align-items: start;
    }

    .status {
      margin-top: 6px;
      color: var(--dim);
      font-size: 1rem;
      line-height: 1.45;
      max-width: 44ch;
    }

    .gestures {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 18px;
    }

    .gestures li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 600;
    }

    .gestures span span { display: block; font-weight: 400; color: var(--dim); font-size: 0.875rem; }

    .gestures svg {
      width: 48px;
      height: 48px;
      padding: 11px;
      border-radius: 50%;
      border: 1px solid var(--edge);
      background: var(--wood);
      color: var(--text);
      flex-shrink: 0;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease, transform 0.2s var(--ease);
    }

    .gestures li.on svg {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--black);
      transform: scale(1.08);
    }

    .btn-cam { margin-top: 22px; }

    .btn-cam.is-on {
      background: var(--wood);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--edge);
    }

    .btn-cam.is-on:hover { background: #26190f; }

    .btn-cam:disabled { background: var(--wood); color: var(--dim); box-shadow: inset 0 0 0 1px var(--edge); }

    /* Webcam preview. GestureModule mounts the video here and sets display:block. */
    #gesture-overlay {
      display: none;
      width: 200px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px var(--edge), 0 10px 22px rgba(0, 0, 0, 0.5);
    }

    .keys { border-left: 1px solid rgba(243, 234, 217, 0.1); padding-left: 56px; }

    .keys dl { margin-top: 14px; display: grid; gap: 10px; }

    .keys dl div { display: flex; align-items: center; gap: 16px; }

    .keys dt { display: flex; align-items: center; gap: 6px; min-width: 132px; color: var(--dim); font-size: 0.875rem; }

    .keys dd { font-weight: 600; }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 32px;
      height: 32px;
      padding: 0 9px;
      border-radius: 6px;
      border: 1px solid var(--edge);
      border-bottom-width: 3px;
      background: var(--wood);
      color: var(--text);
      font: 600 0.875rem var(--sans);
    }

    /* Touch buttons, only on phones and tablets */
    .pad { display: none; }

    .pad button {
      height: 64px;
      border-radius: 10px;
      font-size: 1.125rem;
      font-weight: 700;
      touch-action: manipulation;
      -webkit-user-select: none;
              user-select: none;
    }

    .pad .duck { background: var(--wood); box-shadow: inset 0 0 0 1px var(--edge); }
    .pad .jump { background: var(--yellow); color: var(--black); }
    .pad button:active { transform: scale(0.97); }

    @media (pointer: coarse) {
      .pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
      .keys { display: none; }
      .controls { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      #app { padding: 16px 16px 32px; }
      main { align-self: start; padding-top: 24px; }
      .stage { margin: 0 -16px; border-radius: 0; }
      .controls { grid-template-columns: 1fr; gap: 32px; }
      .keys { border-left: 0; padding-left: 0; border-top: 1px solid rgba(243, 234, 217, 0.1); padding-top: 28px; }
      .hand { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .curtain, .curtain.down { transition: opacity 0.2s ease, visibility 0s 0.2s; transform: none; }
      .curtain.down { opacity: 0; }
    }
  </style>
</head>
<body>

  <!--
    ⚠️  IMPORTANT — Local HTTP server required
    ════════════════════════════════════════════
    This project uses ES modules (<script type="module">).
    Opening index.html directly via file:// will fail with a CORS error.
    Serve from a local HTTP server instead:

      python3 -m http.server 8080
      then open → http://localhost:8080

    See README.md for more options.
  -->

  <div id="app">

    <header class="bar">
      <p class="mark">Kathakali Run</p>
      <p class="count" id="player-counter" hidden></p>
    </header>

    <main>

      <div class="stage" id="stage">
        <canvas
          id="game-canvas"
          aria-label="Kathakali Run — an endless runner game"
          role="application"
        ></canvas>

        <div class="hud" id="hud" hidden>
          <p id="hud-best-row">Best <span id="hud-best">00000</span></p>
          <p id="hud-score">00000</p>
        </div>

        <!-- The curtain covers the stage until the run starts, and comes back up when it ends -->
        <div class="curtain" id="curtain">
          <div class="panel" id="panel-start">
            <h1>Kathakali Run</h1>
            <p class="ml" lang="ml">കഥകളി റൺ</p>
            <button class="btn" id="btn-start" type="button" disabled>Loading…</button>
            <p class="hint" id="hint-start"></p>
          </div>

          <div class="panel panel-over" id="panel-over" hidden>
            <h2>Game over</h2>
            <p class="result">
              <span>Score<b id="over-score">00000</b></span>
              <span><span id="over-best-label">Best</span><b id="over-best">00000</b></span>
            </p>
            <button class="btn" id="btn-again" type="button">Play again</button>
            <p class="hint" id="hint-again"></p>
          </div>
        </div>
      </div>

      <div class="pad" id="pad">
        <button class="duck" id="pad-duck" type="button">Duck</button>
        <button class="jump" id="pad-jump" type="button">Jump</button>
      </div>

      <div class="controls">

        <section class="hand" aria-labelledby="hand-title">
          <div>
            <h2 id="hand-title">Play with your hand</h2>
            <p class="status" id="cam-status" role="status">Turn on your camera and hold your hand up. Your video stays on this device.</p>

            <ul class="gestures">
              <li id="g-palm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/>
                  <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/>
                  <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
                  <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                </svg>
                <span>Open palm<span>Jump</span></span>
              </li>
              <li id="g-fist">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 11.5V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1.4"/>
                  <path d="M14 10V8a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/>
                  <path d="M10 9.9V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v5"/>
                  <path d="M6 14a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/>
                  <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8 2 2 0 1 1 4 0"/>
                </svg>
                <span>Fist<span>Duck</span></span>
              </li>
            </ul>

            <button class="btn btn-cam" id="webcam-toggle" type="button">Turn on camera</button>
          </div>

          <!-- Webcam preview — beside the guide, never over the game -->
          <div id="gesture-overlay" aria-hidden="true"></div>
        </section>

        <section class="keys" aria-labelledby="keys-title">
          <h2 id="keys-title">Or use the keyboard</h2>
          <dl>
            <div><dt><kbd>↑</kbd> or <kbd>Space</kbd></dt><dd>Jump</dd></div>
            <div><dt><kbd>↓</kbd> hold</dt><dd>Duck</dd></div>
            <div><dt><kbd>Enter</kbd></dt><dd>Start</dd></div>
          </dl>
        </section>

      </div>

    </main>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
